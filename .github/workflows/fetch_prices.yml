# .github/workflows/fetch_prices.yml
name: Crypto Price Fetcher + AI Analysis

on:
  schedule:
    - cron: "0 * * * *"   # Toutes les heures
  workflow_dispatch:        # Lancement manuel possible

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dependances
        run: pip install requests google-genai python-dotenv

      - name: Recuperer les prix et analyser avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_prices.py

      - name: Sauvegarder la DB dans le repo
        run: |
          git config --global user.name  "crypto-bot"
          git config --global user.email "bot@github.com"
          git add crypto_data.db bot.log || true
          git diff --staged --quiet || git commit -m "Update prices & signals $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
